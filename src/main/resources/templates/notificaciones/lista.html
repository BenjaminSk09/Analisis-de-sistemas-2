<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Notificaciones')}"></head>

<body>

    <div class="app-shell">

        <aside th:replace="~{fragments/layout :: sidebar('notificaciones')}"></aside>

        <div class="app-main">

            <header th:replace="~{fragments/layout :: topbar('Notificaciones')}"></header>

            <main class="app-content">

                <div class="page-head">
                    <h2>
                        Notificaciones
                        <span class="chip chip-warn align-middle ms-1"
                              th:if="${pendientes > 0}"
                              th:text="${pendientes} + ' sin atender'"></span>
                    </h2>
                </div>

                <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

                <div class="empty-state" th:if="${#lists.isEmpty(notificaciones)}">
                    <i class="bi bi-bell empty-icon"></i>
                    No hay notificaciones registradas todavía.
                </div>

                <div class="table-wrap" th:unless="${#lists.isEmpty(notificaciones)}">
                    <table class="table table-hover align-middle mb-0">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Usuario</th>
                                <th>Título</th>
                                <th>Tipo</th>
                                <th>Mensaje</th>
                                <th>Publicada</th>
                                <th>Atendida</th>
                                <th class="text-end">Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="notificacion : ${notificaciones}">
                                <td th:text="${notificacion.idNotificacion}"></td>
                                <td th:text="${notificacion.usuario != null
                                        ? notificacion.usuario.nombreCompleto
                                        : '-'}"></td>
                                <td th:text="${notificacion.titulo}"></td>
                                <td th:text="${notificacion.tipo}"></td>
                                <td th:text="${notificacion.mensaje}"></td>
                                <td th:text="${notificacion.fechaPublicacion}"></td>
                                <td>
                                    <span class="chip"
                                          th:classappend="${notificacion.estaAtendida()} ? ' chip-success' : ' chip-warn'"
                                          th:text="${notificacion.estaAtendida()} ? 'Sí' : 'No'"></span>
                                </td>
                                <td class="cell-actions">
                                    <form class="d-inline"
                                          th:unless="${notificacion.estaAtendida()}"
                                          th:action="@{/notificaciones/atender/{id}(id=${notificacion.idNotificacion})}"
                                          method="post">
                                        <button type="submit"
                                                class="btn btn-sm btn-outline-success"
                                                title="Marcar atendida">
                                            <i class="bi bi-check2"></i>
                                        </button>
                                    </form>
                                    <form class="d-inline"
                                          th:action="@{/notificaciones/eliminar/{id}(id=${notificacion.idNotificacion})}"
                                          method="post">
                                        <button type="submit"
                                                class="btn btn-sm btn-outline-danger"
                                                title="Eliminar"
                                                onclick="return confirm('¿Eliminar esta notificación? Esta acción no se puede deshacer.')">
                                            <i class="bi bi-trash"></i>
                                        </button>
                                    </form>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

            </main>

        </div>

    </div>

    <div th:replace="~{fragments/layout :: scripts}"></div>

</body>

</html>
