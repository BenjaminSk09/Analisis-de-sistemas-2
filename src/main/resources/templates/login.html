<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Iniciar sesión')}"></head>

<body>

    <button type="button" class="btn-icon login-theme" id="btnTheme" aria-label="Cambiar tema">
        <i id="themeIcon" class="bi bi-moon-stars"></i>
    </button>

    <div class="login-wrap">

        <div class="login-card">

            <div class="login-brand">
                <i class="bi bi-buildings"></i>
                <span>Sistema de Condominio</span>
            </div>

            <p class="login-sub">Inicia sesión para continuar</p>

            <div class="alert alert-danger py-2" th:if="${error}" th:text="${error}"></div>

            <div class="alert alert-success py-2" th:if="${param.logout}">
                Sesión cerrada correctamente.
            </div>

            <form th:action="@{/login}" method="post">

                <div class="mb-3">
                    <label class="form-label" for="usuario">Usuario</label>
                    <input class="form-control"
                           type="text"
                           id="usuario"
                           name="usuario"
                           th:value="${usuario}"
                           autocomplete="username"
                           autofocus
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label" for="clave">Contraseña</label>
                    <input class="form-control"
                           type="password"
                           id="clave"
                           name="clave"
                           autocomplete="current-password"
                           required>
                </div>

                <button class="btn btn-primary w-100" type="submit">
                    Entrar
                </button>

            </form>

        </div>

    </div>

    <div th:replace="~{fragments/layout :: scripts}"></div>

</body>

</html>
