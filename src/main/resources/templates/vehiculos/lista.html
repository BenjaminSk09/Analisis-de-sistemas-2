<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Vehículos')}"></head>

<body>

    <div class="app-shell">

        <aside th:replace="~{fragments/layout :: sidebar('vehiculos')}"></aside>

        <div class="app-main">

            <header th:replace="~{fragments/layout :: topbar('Gestión de Vehículos')}"></header>

            <main class="app-content">

                <div class="page-head">
                    <h2>Vehículos</h2>
                    <a class="btn btn-primary" th:href="@{/vehiculos/nuevo}">
                        <i class="bi bi-plus-lg"></i> Registrar nuevo vehículo
                    </a>
                </div>

                <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

                <div class="empty-state" th:if="${#lists.isEmpty(vehiculos)}">
                    <i class="bi bi-car-front empty-icon"></i>
                    No hay vehículos registrados todavía.
                </div>

                <div class="table-wrap" th:unless="${#lists.isEmpty(vehiculos)}">
                    <table class="table table-hover align-middle mb-0">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Vivienda</th>
                                <th>Placa</th>
                                <th>Marca</th>
                                <th>Modelo</th>
                                <th>Color</th>
                                <th>Tipo</th>
                                <th>Estado</th>
                                <th class="text-end">Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="vehiculo : ${vehiculos}">
                                <td th:text="${vehiculo.idVehiculo}"></td>
                                <td th:text="${vehiculo.vivienda.numero + ' - Bloque ' + vehiculo.vivienda.bloque}"></td>
                                <td th:text="${vehiculo.placa}"></td>
                                <td th:text="${vehiculo.marca}"></td>
                                <td th:text="${vehiculo.modelo}"></td>
                                <td th:text="${vehiculo.color}"></td>
                                <td th:text="${vehiculo.tipo}"></td>
                                <td>
                                    <span class="chip"
                                          th:classappend="${vehiculo.estado} ? ' chip-success' : ' chip-neutral'"
                                          th:text="${vehiculo.estado} ? 'Activo' : 'Inactivo'"></span>
                                </td>
                                <td class="cell-actions">
                                    <a class="btn btn-sm btn-outline-secondary"
                                       th:href="@{/vehiculos/editar/{id}(id=${vehiculo.idVehiculo})}"
                                       title="Editar">
                                        <i class="bi bi-pencil"></i>
                                    </a>
                                    <form class="d-inline"
                                          th:action="@{/vehiculos/eliminar/{id}(id=${vehiculo.idVehiculo})}"
                                          method="post">
                                        <button type="submit"
                                                class="btn btn-sm btn-outline-danger"
                                                title="Eliminar"
                                                onclick="return confirm('¿Eliminar este vehículo? Esta acción no se puede deshacer.')">
                                            <i class="bi bi-trash"></i>
                                        </button>
                                    </form>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <div th:replace="~{fragments/comun :: paginador}"></div>

            </main>

        </div>

    </div>

    <div th:replace="~{fragments/layout :: scripts}"></div>

</body>

</html>
