<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Formulario de Vehículo')}"></head>

<body>

    <div class="app-shell">

        <aside th:replace="~{fragments/layout :: sidebar('vehiculos')}"></aside>

        <div class="app-main">

            <header th:replace="~{fragments/layout :: topbar('Formulario de Vehículo')}"></header>

            <main class="app-content">

                <div class="page-head">
                    <h2>Formulario de Vehículo</h2>
                    <a class="btn btn-outline-secondary" th:href="@{/vehiculos}">
                        <i class="bi bi-arrow-left"></i> Volver
                    </a>
                </div>

                <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

                <div class="form-panel">

                    <form th:action="@{/vehiculos/guardar}" method="post">

                        <input type="hidden"
                               name="idVehiculo"
                               th:value="${vehiculo.idVehiculo}">

                        <div class="row g-3">

                            <div class="col-md-6">
                                <label class="form-label" for="viviendaId">Vivienda</label>
                                <select class="form-select" id="viviendaId" name="viviendaId" required>
                                    <option value="">Seleccione una vivienda</option>
                                    <option th:each="vivienda : ${viviendas}"
                                            th:value="${vivienda.idVivienda}"
                                            th:text="${vivienda.numero + ' - Bloque ' + vivienda.bloque}"
                                            th:selected="${vehiculo.vivienda != null
                                                    and vehiculo.vivienda.idVivienda == vivienda.idVivienda}">
                                    </option>
                                </select>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label" for="placa">Placa</label>
                                <input type="text" class="form-control" id="placa" name="placa"
                                       th:value="${vehiculo.placa}"
                                       maxlength="20"
                                       required>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label" for="marca">Marca</label>
                                <input type="text" class="form-control" id="marca" name="marca"
                                       th:value="${vehiculo.marca}"
                                       maxlength="50"
                                       required>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label" for="modelo">Modelo</label>
                                <input type="text" class="form-control" id="modelo" name="modelo"
                                       th:value="${vehiculo.modelo}"
                                       maxlength="50"
                                       required>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label" for="color">Color</label>
                                <input type="text" class="form-control" id="color" name="color"
                                       th:value="${vehiculo.color}"
                                       maxlength="30"
                                       required>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label" for="tipo">Tipo</label>
                                <select class="form-select" id="tipo" name="tipo" required>
                                    <option value="">Seleccione</option>

                                    <option value="Automovil"
                                            th:selected="${vehiculo.tipo == 'Automovil'}">
                                        Automóvil
                                    </option>

                                    <option value="Motocicleta"
                                            th:selected="${vehiculo.tipo == 'Motocicleta'}">
                                        Motocicleta
                                    </option>

                                    <option value="Pickup"
                                            th:selected="${vehiculo.tipo == 'Pickup'}">
                                        Pickup
                                    </option>

                                    <option value="Otro"
                                            th:selected="${vehiculo.tipo == 'Otro'}">
                                        Otro
                                    </option>
                                </select>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label" for="estadoVehiculo">Estado</label>
                                <select class="form-select" id="estadoVehiculo" name="estado" required>
                                    <option value="true"
                                            th:selected="${vehiculo.estado == true}">
                                        Activo
                                    </option>

                                    <option value="false"
                                            th:selected="${vehiculo.estado == false}">
                                        Inactivo
                                    </option>
                                </select>
                            </div>

                        </div>

                        <div class="form-actions">
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-check-lg"></i> Guardar
                            </button>
                            <a class="btn btn-outline-secondary" th:href="@{/vehiculos}">Cancelar</a>
                        </div>

                    </form>

                </div>

            </main>

        </div>

    </div>

    <div th:replace="~{fragments/layout :: scripts}"></div>

</body>

</html>
