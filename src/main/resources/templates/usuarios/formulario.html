<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Formulario de Usuario')}"></head>

<body>

    <div class="app-shell">

        <aside th:replace="~{fragments/layout :: sidebar('usuarios')}"></aside>

        <div class="app-main">

            <header th:replace="~{fragments/layout :: topbar('Formulario de Usuario')}"></header>

            <main class="app-content">

                <div class="page-head">
                    <h2>Formulario de Usuario</h2>
                    <a class="btn btn-outline-secondary" th:href="@{/usuarios}">
                        <i class="bi bi-arrow-left"></i> Volver
                    </a>
                </div>

                <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

                <div class="form-panel">

                    <form th:action="@{/usuarios/guardar}" method="post">

                        <input type="hidden"
                               name="idUsuario"
                               th:value="${usuario.idUsuario}">

                        <div class="row g-3">

                            <div class="col-md-6">
                                <label class="form-label" for="idPersona">Persona</label>
                                <select class="form-select" id="idPersona" name="idPersona" required>
                                    <option value="">Seleccione</option>
                                    <option th:each="p : ${personas}"
                                            th:value="${p.idPersona}"
                                            th:selected="${(p.idPersona == idPersonaSeleccionada)
                                                    || (usuario.persona != null
                                                        && p.idPersona == usuario.persona.idPersona)}"
                                            th:text="${p.nombres + ' ' + p.apellidos
                                                    + ' (DPI ' + p.dpi + ')'}">
                                    </option>
                                </select>
                                <div class="form-text" th:if="${esNuevo}">
                                    Los datos personales (nombres, DPI, teléfono, correo) se
                                    registran en el módulo de Personas.
                                </div>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label" for="nombreUsuario">Nombre de usuario</label>
                                <input type="text" class="form-control" id="nombreUsuario" name="nombreUsuario"
                                       th:value="${esNuevo}
                                               ? ${nombreUsuarioIntentado} : ${usuario.username}"
                                       required>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label" for="clave">Contraseña</label>
                                <input type="password" class="form-control" id="clave" name="clave"
                                       th:required="${esNuevo}"
                                       placeholder="Dejar vacío para no cambiarla">
                                <div class="form-text">Se guarda como hash SHA-256, no en texto plano.</div>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label" for="idRol">Rol</label>
                                <select class="form-select" id="idRol" name="idRol" required>
                                    <option value="">Seleccione</option>
                                    <option th:each="r : ${roles}"
                                            th:value="${r.idRol}"
                                            th:selected="${(r.idRol == idRolSeleccionado)
                                                    || (usuario.rol != null
                                                        && r.idRol == usuario.rol.idRol)}"
                                            th:text="${r.nombre}">
                                    </option>
                                </select>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label" for="estadoUsuario">Estado</label>
                                <select class="form-select" id="estadoUsuario" name="estado" required>
                                    <option value="true"
                                            th:selected="${usuario.estado == true}">
                                        Activo
                                    </option>
                                    <option value="false"
                                            th:selected="${usuario.estado == false}">
                                        Inactivo
                                    </option>
                                </select>
                                <div class="form-text">Un usuario inactivo no puede iniciar sesión.</div>
                            </div>

                        </div>

                        <div class="form-actions">
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-check-lg"></i> Guardar
                            </button>
                            <a class="btn btn-outline-secondary" th:href="@{/usuarios}">Cancelar</a>
                        </div>

                    </form>

                </div>

            </main>

        </div>

    </div>

    <div th:replace="~{fragments/layout :: scripts}"></div>

</body>

</html>
