<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Usuarios')}"></head>

<body>

    <div class="app-shell">

        <aside th:replace="~{fragments/layout :: sidebar('usuarios')}"></aside>

        <div class="app-main">

            <header th:replace="~{fragments/layout :: topbar('Usuarios del sistema')}"></header>

            <main class="app-content">

                <div class="page-head">
                    <h2>Usuarios</h2>
                    <a class="btn btn-primary" th:href="@{/usuarios/nuevo}">
                        <i class="bi bi-plus-lg"></i> Registrar nuevo usuario
                    </a>
                </div>

                <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

                <div class="empty-state" th:if="${#lists.isEmpty(usuarios)}">
                    <i class="bi bi-person-badge empty-icon"></i>
                    No hay usuarios registrados todavía.
                </div>

                <div class="table-wrap" th:unless="${#lists.isEmpty(usuarios)}">
                    <table class="table table-hover align-middle mb-0">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Nombre</th>
                                <th>Usuario</th>
                                <th>Correo</th>
                                <th>Rol</th>
                                <th>Estado</th>
                                <th class="text-end">Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="usuario : ${usuarios}">
                                <td th:text="${usuario.idUsuario}"></td>
                                <td th:text="${usuario.nombreCompleto}"></td>
                                <td th:text="${usuario.username}"></td>
                                <td th:text="${usuario.correo}"></td>
                                <td th:text="${usuario.rol != null ? usuario.rol.nombre : '-'}"></td>
                                <td>
                                    <span class="chip"
                                          th:classappend="${usuario.estado} ? ' chip-success' : ' chip-neutral'"
                                          th:text="${usuario.estado} ? 'Activo' : 'Inactivo'"></span>
                                </td>
                                <td class="cell-actions">
                                    <a class="btn btn-sm btn-outline-secondary"
                                       th:href="@{/usuarios/editar/{id}(id=${usuario.idUsuario})}"
                                       title="Editar">
                                        <i class="bi bi-pencil"></i>
                                    </a>
                                    <form class="d-inline"
                                          th:action="@{/usuarios/eliminar/{id}(id=${usuario.idUsuario})}"
                                          method="post">
                                        <button type="submit"
                                                class="btn btn-sm btn-outline-danger"
                                                title="Eliminar"
                                                onclick="return confirm('¿Eliminar este usuario? Esta acción no se puede deshacer.')">
                                            <i class="bi bi-trash"></i>
                                        </button>
                                    </form>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <div th:replace="~{fragments/comun :: paginador}"></div>

            </main>

        </div>

    </div>

    <div th:replace="~{fragments/layout :: scripts}"></div>

</body>

</html>
