<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Panel principal')}"></head>

<body>

    <div class="app-shell">

        <aside th:replace="~{fragments/layout :: sidebar('dashboard')}"></aside>

        <div class="app-main">

            <header th:replace="~{fragments/layout :: topbar('Panel principal')}"></header>

            <main class="app-content">

                <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

                <div class="alert alert-warning" th:if="${param.denegado}">
                    No tienes permiso para acceder a esa sección.
                </div>

                <h2 class="h5 fw-bold mb-3">Resumen del condominio</h2>

                <div class="kpi-grid">

                    <a class="kpi" th:href="@{/personas}">
                        <span class="kpi-icon"><i class="bi bi-people"></i></span>
                        <span class="kpi-value" th:text="${totalPersonas}">0</span>
                        <span class="kpi-label">Personas</span>
                    </a>

                    <a class="kpi" th:href="@{/viviendas}">
                        <span class="kpi-icon"><i class="bi bi-house-door"></i></span>
                        <span class="kpi-value" th:text="${totalViviendas}">0</span>
                        <span class="kpi-label">Viviendas</span>
                    </a>

                    <a class="kpi" th:href="@{/vehiculos}">
                        <span class="kpi-icon"><i class="bi bi-car-front"></i></span>
                        <span class="kpi-value" th:text="${totalVehiculos}">0</span>
                        <span class="kpi-label">Vehículos</span>
                    </a>

                    <a class="kpi" th:href="@{/vivienda-persona}">
                        <span class="kpi-icon"><i class="bi bi-diagram-3"></i></span>
                        <span class="kpi-value" th:text="${totalRelaciones}">0</span>
                        <span class="kpi-label">Vivienda - Persona</span>
                    </a>

                    <a class="kpi" th:href="@{/cuotas}">
                        <span class="kpi-icon"><i class="bi bi-receipt"></i></span>
                        <span class="kpi-value" th:text="${totalCuotas}">0</span>
                        <span class="kpi-label">Cuotas</span>
                    </a>

                    <a class="kpi" th:href="@{/pagos}">
                        <span class="kpi-icon"><i class="bi bi-cash-coin"></i></span>
                        <span class="kpi-value" th:text="${totalPagos}">0</span>
                        <span class="kpi-label">Pagos</span>
                    </a>

                    <a class="kpi" th:href="@{/notificaciones}">
                        <span class="kpi-icon"><i class="bi bi-bell"></i></span>
                        <span class="kpi-value" th:text="${totalNotificaciones}">0</span>
                        <span class="kpi-label">Notificaciones</span>
                        <span class="chip chip-warn mt-1"
                              th:if="${notificacionesPendientes > 0}"
                              th:text="${notificacionesPendientes} + ' sin atender'"></span>
                    </a>

                </div>

                <div th:if="${session.usuario.rol != null
                        and session.usuario.rol.esAdministrador()}">

                    <h2 class="h5 fw-bold mb-3">Administración</h2>

                    <div class="kpi-grid">

                        <a class="kpi" th:href="@{/usuarios}">
                            <span class="kpi-icon"><i class="bi bi-person-badge"></i></span>
                            <span class="kpi-value" th:text="${totalUsuarios}">0</span>
                            <span class="kpi-label">Usuarios del sistema</span>
                        </a>

                        <div class="kpi">
                            <span class="kpi-icon"><i class="bi bi-shield-check"></i></span>
                            <span class="kpi-value" th:text="${totalAdministradores}">0</span>
                            <span class="kpi-label">Administradores</span>
                        </div>

                        <div class="kpi">
                            <span class="kpi-icon"><i class="bi bi-clipboard-check"></i></span>
                            <span class="kpi-value" th:text="${totalPersonalAdministrativo}">0</span>
                            <span class="kpi-label">Personal Administrativo</span>
                        </div>

                        <div class="kpi">
                            <span class="kpi-icon"><i class="bi bi-wallet2"></i></span>
                            <span class="kpi-value" th:text="${totalEncargadosCobros}">0</span>
                            <span class="kpi-label">Encargados de Cobros</span>
                        </div>

                    </div>

                </div>

            </main>

        </div>

    </div>

    <div th:replace="~{fragments/layout :: scripts}"></div>

</body>

</html>
