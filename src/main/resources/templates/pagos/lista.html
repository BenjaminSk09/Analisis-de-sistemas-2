<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Pagos')}"></head>

<body>

    <div class="app-shell">

        <aside th:replace="~{fragments/layout :: sidebar('pagos')}"></aside>

        <div class="app-main">

            <header th:replace="~{fragments/layout :: topbar('Gestión de Pagos')}"></header>

            <main class="app-content">

                <div class="page-head">
                    <h2>Pagos</h2>
                    <a class="btn btn-primary" th:href="@{/pagos/nuevo}">
                        <i class="bi bi-plus-lg"></i> Registrar nuevo pago
                    </a>
                </div>

                <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

                <div class="empty-state" th:if="${#lists.isEmpty(pagos)}">
                    <i class="bi bi-cash-coin empty-icon"></i>
                    No hay pagos registrados todavía.
                </div>

                <div class="table-wrap" th:unless="${#lists.isEmpty(pagos)}">
                    <table class="table table-hover align-middle mb-0">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Cuota</th>
                                <th>Monto</th>
                                <th>Fecha de pago</th>
                                <th>Método</th>
                                <th>Referencia</th>
                                <th>Registrado por</th>
                                <th>Estado</th>
                                <th class="text-end">Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="pago : ${pagos}">
                                <td th:text="${pago.idPago}"></td>
                                <td th:text="${pago.cuota != null ? pago.cuota.periodo : '-'}"></td>
                                <td th:text="'Q' + ${pago.monto}"></td>
                                <td th:text="${pago.fechaPago}"></td>
                                <td th:text="${pago.metodoPago}"></td>
                                <td th:text="${pago.referencia}"></td>
                                <td th:text="${pago.usuario != null ? pago.usuario.username : '-'}"></td>
                                <td>
                                    <span class="chip"
                                          th:classappend="${pago.estado == 'Aprobado'} ? ' chip-success' : (${pago.estado == 'Pendiente'} ? ' chip-warn' : ' chip-danger')"
                                          th:text="${pago.estado}"></span>
                                </td>
                                <td class="cell-actions">
                                    <form class="d-inline"
                                          th:action="@{/pagos/eliminar/{id}(id=${pago.idPago})}"
                                          method="post">
                                        <button type="submit"
                                                class="btn btn-sm btn-outline-danger"
                                                title="Eliminar"
                                                onclick="return confirm('¿Eliminar este pago? El saldo de la cuota volverá a calcularse.')">
                                            <i class="bi bi-trash"></i>
                                        </button>
                                    </form>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

            </main>

        </div>

    </div>

    <div th:replace="~{fragments/layout :: scripts}"></div>

</body>

</html>
