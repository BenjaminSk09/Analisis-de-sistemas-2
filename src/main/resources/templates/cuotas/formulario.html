<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Formulario de Cuota')}"></head>

<body>

    <div class="app-shell">

        <aside th:replace="~{fragments/layout :: sidebar('cuotas')}"></aside>

        <div class="app-main">

            <header th:replace="~{fragments/layout :: topbar('Formulario de Cuota')}"></header>

            <main class="app-content">

                <div class="page-head">
                    <h2>Formulario de Cuota</h2>
                    <a class="btn btn-outline-secondary" th:href="@{/cuotas}">
                        <i class="bi bi-arrow-left"></i> Volver
                    </a>
                </div>

                <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

                <div class="form-panel">

                    <form th:action="@{/cuotas/guardar}" method="post">

                        <input type="hidden" name="idCuota" th:value="${cuota.idCuota}">

                        <div class="row g-3">

                            <div class="col-md-6">
                                <label class="form-label" for="idVivienda">Vivienda</label>
                                <select class="form-select" id="idVivienda" name="idVivienda" required>
                                    <option value="">Seleccione</option>
                                    <option th:each="v : ${viviendas}"
                                            th:value="${v.idVivienda}"
                                            th:selected="${cuota.vivienda != null
                                                    && cuota.vivienda.idVivienda == v.idVivienda}"
                                            th:text="${v.numero + ' (' + v.bloque + ')'}">
                                    </option>
                                </select>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label" for="idConcepto">Concepto</label>
                                <select class="form-select" id="idConcepto" name="idConcepto" required>
                                    <option value="">Seleccione</option>
                                    <option th:each="c : ${conceptos}"
                                            th:value="${c.idConcepto}"
                                            th:selected="${cuota.concepto != null
                                                    && cuota.concepto.idConcepto == c.idConcepto}"
                                            th:text="${c.nombre + ' (base Q' + c.montoBase
                                                    + ', ' + c.periodicidad + ')'}">
                                    </option>
                                </select>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label" for="periodo">Periodo</label>
                                <input type="text" class="form-control" id="periodo" name="periodo"
                                       th:value="${cuota.periodo}"
                                       placeholder="Ej. Septiembre 2026"
                                       maxlength="20"
                                       required>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label" for="monto">Monto</label>
                                <input type="number" class="form-control" id="monto" name="monto"
                                       step="0.01"
                                       min="0"
                                       th:value="${cuota.monto}"
                                       required>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label" for="fechaEmision">Fecha de emisión</label>
                                <input type="date" class="form-control" id="fechaEmision" name="fechaEmision"
                                       th:value="${cuota.fechaEmision}"
                                       required>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label" for="fechaVencimiento">Fecha de vencimiento</label>
                                <input type="date" class="form-control" id="fechaVencimiento" name="fechaVencimiento"
                                       th:value="${cuota.fechaVencimiento}"
                                       required>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label" for="estado">Estado</label>
                                <select class="form-select" id="estado" name="estado">
                                    <option th:each="e : ${estados}"
                                            th:value="${e}"
                                            th:text="${e}"
                                            th:selected="${cuota.estado == e}">
                                    </option>
                                </select>
                            </div>

                            <div class="col-12" th:if="${!esNuevo}">
                                <div class="form-text">
                                    Lo pagado (Q<span th:text="${cuota.montoPagado}"></span>)
                                    y el saldo se calculan con los pagos registrados,
                                    no se escriben a mano.
                                </div>
                            </div>

                        </div>

                        <div class="form-actions">
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-check-lg"></i> Guardar
                            </button>
                            <a class="btn btn-outline-secondary" th:href="@{/cuotas}">Cancelar</a>
                        </div>

                    </form>

                </div>

            </main>

        </div>

    </div>

    <div th:replace="~{fragments/layout :: scripts}"></div>

</body>

</html>
