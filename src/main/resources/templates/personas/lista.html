<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Personas')}"></head>

<body>

    <div class="app-shell">

        <aside th:replace="~{fragments/layout :: sidebar('personas')}"></aside>

        <div class="app-main">

            <header th:replace="~{fragments/layout :: topbar('Gestión de Personas')}"></header>

            <main class="app-content">

                <div class="page-head">
                    <h2>Personas</h2>
                    <a class="btn btn-primary" th:href="@{/personas/nuevo}">
                        <i class="bi bi-plus-lg"></i> Registrar nueva persona
                    </a>
                </div>

                <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

                <div class="empty-state" th:if="${#lists.isEmpty(personas)}">
                    <i class="bi bi-people empty-icon"></i>
                    No hay personas registradas todavía.
                </div>

                <div class="table-wrap" th:unless="${#lists.isEmpty(personas)}">
                    <table class="table table-hover align-middle mb-0">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Nombres</th>
                                <th>Apellidos</th>
                                <th>DPI</th>
                                <th>Teléfono</th>
                                <th>Correo</th>
                                <th>Nacimiento</th>
                                <th>Estado</th>
                                <th class="text-end">Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="persona : ${personas}">
                                <td th:text="${persona.idPersona}"></td>
                                <td th:text="${persona.nombres}"></td>
                                <td th:text="${persona.apellidos}"></td>
                                <td th:text="${persona.dpi}"></td>
                                <td th:text="${persona.telefono}"></td>
                                <td th:text="${persona.correo}"></td>
                                <td th:text="${persona.fechaNacimiento}"></td>
                                <td>
                                    <span class="chip"
                                          th:classappend="${persona.estado} ? ' chip-success' : ' chip-neutral'"
                                          th:text="${persona.estado} ? 'Activa' : 'Inactiva'"></span>
                                </td>
                                <td class="cell-actions">
                                    <a class="btn btn-sm btn-outline-secondary"
                                       th:href="@{/personas/editar/{id}(id=${persona.idPersona})}"
                                       title="Editar">
                                        <i class="bi bi-pencil"></i>
                                    </a>
                                    <form class="d-inline"
                                          th:action="@{/personas/eliminar/{id}(id=${persona.idPersona})}"
                                          method="post">
                                        <button type="submit"
                                                class="btn btn-sm btn-outline-danger"
                                                title="Eliminar"
                                                onclick="return confirm('¿Eliminar este registro de persona? Esta acción no se puede deshacer.')">
                                            <i class="bi bi-trash"></i>
                                        </button>
                                    </form>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <div th:replace="~{fragments/comun :: paginador}"></div>

            </main>

        </div>

    </div>

    <div th:replace="~{fragments/layout :: scripts}"></div>

</body>

</html>
