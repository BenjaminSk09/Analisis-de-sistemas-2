<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Formulario de Persona')}"></head>

<body>

    <div class="app-shell">

        <aside th:replace="~{fragments/layout :: sidebar('personas')}"></aside>

        <div class="app-main">

            <header th:replace="~{fragments/layout :: topbar('Formulario de Persona')}"></header>

            <main class="app-content">

                <div class="page-head">
                    <h2>Formulario de Persona</h2>
                    <a class="btn btn-outline-secondary" th:href="@{/personas}">
                        <i class="bi bi-arrow-left"></i> Volver
                    </a>
                </div>

                <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

                <div class="form-panel">

                    <form th:action="@{/personas/guardar}"
                          th:object="${persona}"
                          method="post">

                        <input type="hidden" th:field="*{idPersona}">

                        <div class="row g-3">

                            <div class="col-md-6">
                                <label class="form-label" for="nombres">Nombres</label>
                                <input type="text" class="form-control"
                                       th:field="*{nombres}"
                                       maxlength="100"
                                       required>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label" for="apellidos">Apellidos</label>
                                <input type="text" class="form-control"
                                       th:field="*{apellidos}"
                                       maxlength="100"
                                       required>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label" for="dpi">DPI</label>
                                <input type="text" class="form-control"
                                       th:field="*{dpi}"
                                       maxlength="20"
                                       required>
                                <div class="form-text">No se puede repetir entre personas.</div>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label" for="telefono">Teléfono</label>
                                <input type="text" class="form-control"
                                       th:field="*{telefono}"
                                       maxlength="20">
                            </div>

                            <div class="col-md-6">
                                <label class="form-label" for="correo">Correo</label>
                                <input type="email" class="form-control"
                                       th:field="*{correo}"
                                       maxlength="150">
                            </div>

                            <div class="col-md-6">
                                <label class="form-label" for="fechaNacimiento">Fecha de nacimiento</label>
                                <input type="date" class="form-control"
                                       th:field="*{fechaNacimiento}">
                            </div>

                            <div class="col-md-6">
                                <label class="form-label" for="estado">Estado</label>
                                <select class="form-select"
                                        th:field="*{estado}"
                                        required>
                                    <option value="true">Activa</option>
                                    <option value="false">Inactiva</option>
                                </select>
                            </div>

                        </div>

                        <div class="form-actions">
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-check-lg"></i> Guardar
                            </button>
                            <a class="btn btn-outline-secondary" th:href="@{/personas}">Cancelar</a>
                        </div>

                    </form>

                </div>

            </main>

        </div>

    </div>

    <div th:replace="~{fragments/layout :: scripts}"></div>

</body>

</html>
