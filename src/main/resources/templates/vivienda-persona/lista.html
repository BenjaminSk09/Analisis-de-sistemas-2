<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Vivienda - Persona')}"></head>

<body>

    <div class="app-shell">

        <aside th:replace="~{fragments/layout :: sidebar('vivienda-persona')}"></aside>

        <div class="app-main">

            <header th:replace="~{fragments/layout :: topbar('Relaciones Vivienda - Persona')}"></header>

            <main class="app-content">

                <div class="page-head">
                    <h2>Vivienda - Persona</h2>
                    <a class="btn btn-primary" th:href="@{/vivienda-persona/nuevo}">
                        <i class="bi bi-plus-lg"></i> Registrar nueva relación
                    </a>
                </div>

                <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

                <div class="empty-state" th:if="${#lists.isEmpty(relaciones)}">
                    <i class="bi bi-diagram-3 empty-icon"></i>
                    No hay relaciones registradas todavía.
                </div>

                <div class="table-wrap" th:unless="${#lists.isEmpty(relaciones)}">
                    <table class="table table-hover align-middle mb-0">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Vivienda</th>
                                <th>Persona</th>
                                <th>Tipo de relación</th>
                                <th>Fecha inicio</th>
                                <th>Fecha fin</th>
                                <th>Estado</th>
                                <th class="text-end">Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="relacion : ${relaciones}">
                                <td th:text="${relacion.idViviendaPersona}"></td>
                                <td th:text="${relacion.vivienda.numero + ' - Bloque ' + relacion.vivienda.bloque}"></td>
                                <td th:text="${relacion.persona.nombres + ' ' + relacion.persona.apellidos}"></td>
                                <td th:text="${relacion.tipoRelacion}"></td>
                                <td th:text="${relacion.fechaInicio}"></td>
                                <td th:text="${relacion.fechaFin != null ? relacion.fechaFin : 'Sin fecha'}"></td>
                                <td>
                                    <span class="chip"
                                          th:classappend="${relacion.estado} ? ' chip-success' : ' chip-neutral'"
                                          th:text="${relacion.estado} ? 'Activa' : 'Inactiva'"></span>
                                </td>
                                <td class="cell-actions">
                                    <a class="btn btn-sm btn-outline-secondary"
                                       th:href="@{/vivienda-persona/editar/{id}(id=${relacion.idViviendaPersona})}"
                                       title="Editar">
                                        <i class="bi bi-pencil"></i>
                                    </a>
                                    <form class="d-inline"
                                          th:action="@{/vivienda-persona/eliminar/{id}(id=${relacion.idViviendaPersona})}"
                                          method="post">
                                        <button type="submit"
                                                class="btn btn-sm btn-outline-danger"
                                                title="Eliminar"
                                                onclick="return confirm('¿Eliminar esta asignación de vivienda? Esta acción no se puede deshacer.')">
                                            <i class="bi bi-trash"></i>
                                        </button>
                                    </form>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

            </main>

        </div>

    </div>

    <div th:replace="~{fragments/layout :: scripts}"></div>

</body>

</html>
