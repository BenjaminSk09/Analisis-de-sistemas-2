<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Relación Vivienda - Persona')}"></head>

<body>

    <div class="app-shell">

        <aside th:replace="~{fragments/layout :: sidebar('vivienda-persona')}"></aside>

        <div class="app-main">

            <header th:replace="~{fragments/layout :: topbar('Relación Vivienda - Persona')}"></header>

            <main class="app-content">

                <div class="page-head">
                    <h2>Relación Vivienda - Persona</h2>
                    <a class="btn btn-outline-secondary" th:href="@{/vivienda-persona}">
                        <i class="bi bi-arrow-left"></i> Volver
                    </a>
                </div>

                <p class="text-body-secondary mb-3">
                    Asigna una persona a una vivienda. Los tipos válidos son los que
                    acepta la base de datos: Propietario, Residente, Inquilino o Familiar.
                </p>

                <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

                <div class="form-panel">

                    <form th:action="@{/vivienda-persona/guardar}" method="post">

                        <input type="hidden"
                               name="idViviendaPersona"
                               th:value="${relacion.idViviendaPersona}">

                        <div class="row g-3">

                            <div class="col-md-6">
                                <label class="form-label" for="viviendaId">Vivienda</label>
                                <select class="form-select" id="viviendaId" name="viviendaId" required>
                                    <option value="">Seleccione una vivienda</option>
                                    <option th:each="vivienda : ${viviendas}"
                                            th:value="${vivienda.idVivienda}"
                                            th:text="${vivienda.numero + ' - Bloque ' + vivienda.bloque}"
                                            th:selected="${relacion.vivienda != null
                                                    and relacion.vivienda.idVivienda == vivienda.idVivienda}">
                                    </option>
                                </select>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label" for="personaId">Persona</label>
                                <select class="form-select" id="personaId" name="personaId" required>
                                    <option value="">Seleccione una persona</option>
                                    <option th:each="persona : ${personas}"
                                            th:value="${persona.idPersona}"
                                            th:text="${persona.nombres + ' ' + persona.apellidos}"
                                            th:selected="${relacion.persona != null
                                                    and relacion.persona.idPersona == persona.idPersona}">
                                    </option>
                                </select>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label" for="tipoRelacion">Tipo de relación</label>
                                <select class="form-select" id="tipoRelacion" name="tipoRelacion" required>
                                    <option value="">Seleccione</option>
                                    <option value="Propietario"
                                            th:selected="${relacion.tipoRelacion == 'Propietario'}">
                                        Propietario
                                    </option>
                                    <option value="Residente"
                                            th:selected="${relacion.tipoRelacion == 'Residente'}">
                                        Residente
                                    </option>
                                    <option value="Inquilino"
                                            th:selected="${relacion.tipoRelacion == 'Inquilino'}">
                                        Inquilino
                                    </option>
                                    <option value="Familiar"
                                            th:selected="${relacion.tipoRelacion == 'Familiar'}">
                                        Familiar
                                    </option>
                                </select>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label" for="fechaInicio">Fecha de inicio</label>
                                <input type="date" class="form-control" id="fechaInicio" name="fechaInicio"
                                       th:value="${relacion.fechaInicio}"
                                       required>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label" for="fechaFin">Fecha de fin</label>
                                <input type="date" class="form-control" id="fechaFin" name="fechaFin"
                                       th:value="${relacion.fechaFin}">
                                <div class="form-text">Vacío si la persona todavía vive ahí.</div>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label" for="estadoRelacion">Estado</label>
                                <select class="form-select" id="estadoRelacion" name="estado" required>
                                    <option value="true"
                                            th:selected="${relacion.estado == true}">
                                        Activa
                                    </option>
                                    <option value="false"
                                            th:selected="${relacion.estado == false}">
                                        Inactiva
                                    </option>
                                </select>
                            </div>

                        </div>

                        <div class="form-actions">
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-check-lg"></i> Guardar
                            </button>
                            <a class="btn btn-outline-secondary" th:href="@{/vivienda-persona}">Cancelar</a>
                        </div>

                    </form>

                </div>

            </main>

        </div>

    </div>

    <div th:replace="~{fragments/layout :: scripts}"></div>

</body>

</html>
