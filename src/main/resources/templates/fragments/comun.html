<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<body>

    <header class="topbar" th:fragment="barra">

        <span class="marca">
            <a th:href="@{/dashboard}"
               style="color: #ffffff; font-weight: 700;">
                Sistema de Condominio
            </a>
        </span>

        <span class="sesion">
            <span th:text="${session.usuario != null
                    ? session.usuario.nombreCompleto : ''}"></span>
            <a th:href="@{/dashboard}">Panel</a>
            <a th:href="@{/logout}">Salir</a>
        </span>

    </header>

    <nav class="d-flex justify-content-between align-items-center mt-3"
         th:fragment="paginador"
         th:if="${totalPaginas != null and totalPaginas > 1}"
         aria-label="Paginación">

        <small class="text-muted"
               th:text="${totalRegistros} + ' registros - página '
                       + ${paginaActual} + ' de ' + ${totalPaginas}"></small>

        <ul class="pagination pagination-sm mb-0">
            <li class="page-item" th:classappend="${paginaActual == 1} ? 'disabled'">
                <a class="page-link" th:href="'?pagina=' + ${paginaActual - 1}">Anterior</a>
            </li>
            <li class="page-item" th:classappend="${paginaActual == totalPaginas} ? 'disabled'">
                <a class="page-link" th:href="'?pagina=' + ${paginaActual + 1}">Siguiente</a>
            </li>
        </ul>

    </nav>

</body>

</html>
