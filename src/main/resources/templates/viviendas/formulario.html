<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Formulario de Vivienda')}"></head>

<body>

    <div class="app-shell">

        <aside th:replace="~{fragments/layout :: sidebar('viviendas')}"></aside>

        <div class="app-main">

            <header th:replace="~{fragments/layout :: topbar('Formulario de Vivienda')}"></header>

            <main class="app-content">

                <div class="page-head">
                    <h2>Formulario de Vivienda</h2>
                    <a class="btn btn-outline-secondary" th:href="@{/viviendas}">
                        <i class="bi bi-arrow-left"></i> Volver
                    </a>
                </div>

                <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

                <div class="form-panel">

                    <form th:action="@{/viviendas/guardar}"
                          th:object="${vivienda}"
                          method="post">

                        <input type="hidden" th:field="*{idVivienda}">

                        <div class="row g-3">

                            <div class="col-md-6">
                                <label class="form-label" for="numero">Número</label>
                                <input type="text" class="form-control"
                                       th:field="*{numero}"
                                       maxlength="20"
                                       required>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label" for="bloque">Bloque</label>
                                <input type="text" class="form-control"
                                       th:field="*{bloque}"
                                       maxlength="20"
                                       required>
                            </div>

                            <div class="col-12">
                                <label class="form-label" for="direccion">Dirección</label>
                                <input type="text" class="form-control"
                                       th:field="*{direccion}"
                                       maxlength="200"
                                       required>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label" for="estado">Estado</label>
                                <select class="form-select"
                                        th:field="*{estado}"
                                        required>
                                    <option value="">Seleccione</option>
                                    <option value="Ocupada">Ocupada</option>
                                    <option value="Disponible">Disponible</option>
                                    <option value="Mantenimiento">Mantenimiento</option>
                                </select>
                            </div>

                        </div>

                        <div class="form-actions">
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-check-lg"></i> Guardar
                            </button>
                            <a class="btn btn-outline-secondary" th:href="@{/viviendas}">Cancelar</a>
                        </div>

                    </form>

                </div>

            </main>

        </div>

    </div>

    <div th:replace="~{fragments/layout :: scripts}"></div>

</body>

</html>
