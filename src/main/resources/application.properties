spring.application.name=sistema-condominio

# ---------------------------------------------------------------------------
#  Base de datos SQL Server 2025 (base "condominio")
#  El esquema y los datos se cargan con los scripts de la raiz del proyecto:
#    CREACION DE DB Y TABLAS.sql   -> crea la base y las 11 tablas
#    CREACION DE DATOS Y OTROS.sql -> inserta los datos iniciales
#
#  serverName / databaseName se pueden sobreescribir por variable de entorno
#  para no tener que editar este archivo al cambiar de maquina:
#    DB_SERVER, DB_NAME, DB_USER, DB_PASSWORD
#  DB_PASSWORD es obligatoria (no hay clave por defecto). Tambien se puede
#  poner en config/application.properties junto al proyecto (ignorado por git):
#    spring.datasource.password=TU_PASSWORD
#
#  trustServerCertificate=true es necesario porque la instancia usa un
#  certificado autofirmado; sin esto la conexion falla.
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:sqlserver://${DB_SERVER:localhost}:1433;databaseName=${DB_NAME:condominio};encrypt=true;trustServerCertificate=true
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# La instancia de SQL Server de este equipo solo admite 1 conexion simultanea.
# Se limita el pool a 1 y se fija el dialecto para que Hibernate no abra una
# segunda conexion durante el arranque.
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.maximum-pool-size=1
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# ---------------------------------------------------------------------------
#  JPA / Hibernate
#  "validate" no modifica la base: solo comprueba que las entidades coincidan
#  con las tablas reales. Si algo no cuadra, la aplicacion no arranca.
# ---------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Errores de SQL en las pantallas en vez de una pagina en blanco
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=true
